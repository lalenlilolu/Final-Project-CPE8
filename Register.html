<!-- register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - BudgetWise</title>

    <link rel="stylesheet" href="Final P.css">
</head>

<body>

<!-- Background Animation -->
<div class="bg-animation">
    <div class="particles" id="particles"></div>
    <div class="floating-shapes">
        <div class="shape shape1"></div>
        <div class="shape shape2"></div>
        <div class="shape shape3"></div>
    </div>
</div>

<!-- Main Container -->
<div class="container">
    <div class="login-card">

        <!-- Title -->
        <div class="logo-section">
            <h1 class="logo-text">Create Account</h1>
            <p class="logo-subtitle">Join BudgetWise today</p>
        </div>

        <!-- Register Form -->
        <form class="login-form" id="registerForm">

            <div class="input-group">
                <input type="text" placeholder="Username" required>
            </div>

            <div class="input-group">
                <input type="email" placeholder="Email" required>
            </div>

            <div class="input-group">
                <input type="password" placeholder="Password" required>
            </div>

            <!-- Slightly different button text -->
            <button type="submit" class="btn-login">
                Create Account
            </button>
        </form>

        <!-- Footer -->
        <div class="form-footer">
            <p class="link-text">
                Already have an account?
                <a href="Login.html" class="link">Login</a>
            </p>
        </div>

    </div>
</div>

<script src="Finaljs.js"></script>
</body>
</html>
