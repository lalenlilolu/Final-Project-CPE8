<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Budgeting System Group 6</title>
    
    <!-- External CSS and Fonts -->
    <link rel="stylesheet" href="Final P.css">
</head>
<body>

<!-- Background Animation Container -->
<div class="bg-animation">
    <div class="particles" id="particles"></div>
    <div class="floating-shapes">
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
    </div>
</div>

<!-- Main Content -->
<div class="container">
    <div class="login-card">
        
        <!-- Logo Section -->
        <div class="logo-section">
        <h1 class="logo-text">BudgetWise</h1>
     <p class="logo-subtitle">Welcome to Your Budgeting Plan! </p>
        </div>
        
        <!-- Login Form -->
        <form class="login-form" id="loginForm">
            <!-- Username Field -->
            <div class="input-group">
                <i class="fas fa-user icon"></i>
                <input type="text" id="username" placeholder="Enter Username" required>
            </div>
            
            <!-- Password Entering -->
            <div class="input-group">
                <i class="fas fa-lock icon"></i>
                <input type="password" id="password"
                placeholder="Enter Password" required>
            </div>
            
            <!-- Login Button -->
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>
        
        <!-- Footer Links -->
        <div class="form-footer">
        <a href="#" class="link">Forgot Password?</a>
            <span class="separator"> | </span>
            <a href="Register.html" class="link">Create Account</a>
        </div>
    </div>
</div>
</body>
<script src="Finaljs.js"></script>
</html>
